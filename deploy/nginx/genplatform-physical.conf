# deploy/nginx/genplatform-physical.conf
# 物理机部署专用 Nginx 配置
# 安装方式: sudo cp deploy/nginx/genplatform-physical.conf /etc/nginx/sites-available/genplatform
#           sudo ln -sf /etc/nginx/sites-available/genplatform /etc/nginx/sites-enabled/genplatform
#           sudo nginx -t && sudo systemctl reload nginx
#
# 与 Docker 版差异:
#   - proxy_pass http://127.0.0.1:8000  (物理机) vs http://backend:8000 (Docker DNS)
#   - location / 直接 root 服务 Vue3 构建产物，无 frontend 容器

server {
    listen 80;
    server_name _;

    # 最大上传文件大小（与 Django FILE_UPLOAD_MAX_MEMORY_SIZE 保持一致）
    client_max_body_size 100M;

    # ── API: 代理到 Django ASGI 进程（Gunicorn + Uvicorn）────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长超时（LLM 流式生成可能耗时较长）
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # SSE（Server-Sent Events）支持: 禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # ── WebSocket: Django Channels ────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接（24 小时）
        proxy_read_timeout 86400s;
    }

    # ── Django Admin ──────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── 媒体文件（用户上传，由 Django MEDIA_ROOT 管理）───────────────────────
    location /media/ {
        alias /opt/genplatform/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # 禁止执行脚本（安全）
        add_header X-Content-Type-Options nosniff;
    }

    # ── Django collectstatic 产物 ─────────────────────────────────────────────
    location /static/ {
        alias /opt/genplatform/staticfiles/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff;

        # 支持 gzip 压缩（Nginx 静态文件服务）
        gzip_static on;
    }

    # ── Vue3 SPA: 直接服务构建产物，支持 History Mode 路由 ───────────────────
    location / {
        root /opt/genplatform/staticfiles;
        # SPA history mode fallback: 所有未匹配路径回退到 index.html
        try_files $uri $uri/ /index.html;

        # SPA 入口禁止缓存（保证用户获取最新版本）
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";

        # 安全头
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }

    # ── 错误页面 ──────────────────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ── 访问日志 ──────────────────────────────────────────────────────────────
    access_log /opt/genplatform/logs/nginx-access.log;
    error_log  /opt/genplatform/logs/nginx-error.log warn;
}
