name: Physical Deploy to Production

# 手动触发。默认物理机部署；Docker 部署走 ci.yml。
# 策略：scp 从 GitHub Actions runner 直接上传源码，绕开服务器上的 git 依赖。
# setup_system.sh 负责安装 git/python/postgres 等系统依赖（首次必须；后续可选）。
on:
  workflow_dispatch:
    inputs:
      run_setup:
        description: '执行系统环境安装（首次部署必须 true；后续热更新设为 false 可加速）'
        type: boolean
        default: true

jobs:
  deploy-physical:
    name: Physical Deploy to Production (Aliyun)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # ── Step 1: 上传源码 ─────────────────────────────────────────────────────
      # 从 GitHub Actions runner 直接 scp，不依赖服务器上是否安装了 git。
      # rm: false 保留服务器上已有的 .env / media / logs 等文件。
      - name: Upload source code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          password: ${{ secrets.PROD_PASSWORD }}
          source: "scripts,deploy,project_workspace,Makefile,.env.example"
          target: /opt/genplatform/app
          rm: false

      # ── Step 2: 远程部署 ─────────────────────────────────────────────────────
      - name: Deploy on production server (physical)
        uses: appleboy/ssh-action@v1.0.3
        env:
          RUN_SETUP: ${{ github.event.inputs.run_setup }}
          PUBLIC_HOST: ${{ secrets.PROD_HOST }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          password: ${{ secrets.PROD_PASSWORD }}
          envs: RUN_SETUP,PUBLIC_HOST
          command_timeout: 90m
          script: |
            set -e

            APP_DIR=/opt/genplatform
            echo "===== GenPlatform 物理机部署 (GitHub Actions) ====="
            echo "APP_DIR:   $APP_DIR"
            echo "Run setup: $RUN_SETUP"

            # ── 2a: 生成 .env（首次部署自动生成，已存在则跳过）──────────────
            ENV_FILE="$APP_DIR/app/.env"
            if [ ! -f "$ENV_FILE" ]; then
              echo "--- 生成 .env（首次部署）---"

              SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(50))")
              ENCRYPTION_KEY=$(python3 -c "import os,base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
              PG_PASS=$(python3 -c "import secrets; print(secrets.token_urlsafe(24))")
              INTERNAL_IP=$(hostname -I | awk '{print $1}')
              # PUBLIC_HOST 通过 envs 从 secrets.PROD_HOST 注入（公网 IP）
              PUB="${PUBLIC_HOST:-$INTERNAL_IP}"

              mkdir -p "$APP_DIR/app"
              cat > "$ENV_FILE" <<ENVEOF
            DJANGO_SECRET_KEY=${SECRET_KEY}
            DJANGO_SETTINGS_MODULE=config.settings.production
            DEBUG=False
            ENCRYPTION_KEY=${ENCRYPTION_KEY}
            POSTGRES_DB=content_gen_platform
            POSTGRES_USER=postgres
            POSTGRES_PASSWORD=${PG_PASS}
            DATABASE_URL=postgresql://postgres:${PG_PASS}@localhost:5432/content_gen_platform
            REDIS_URL=redis://localhost:6379/0
            ALLOWED_HOSTS=localhost,127.0.0.1,${INTERNAL_IP},${PUB}
            CORS_ALLOWED_ORIGINS=http://${PUB}
            STORAGE_BACKEND=local
            MEDIA_ROOT=/opt/genplatform/media
            EMBEDDING_MODEL=BAAI/bge-small-zh-v1.5
            HF_ENDPOINT=https://hf-mirror.com
            APP_DIR=/opt/genplatform
            BRANCH=main
            ENVEOF

              chmod 600 "$ENV_FILE"
              echo "[OK] .env 已生成（ALLOWED_HOSTS 包含内网 IP 和公网 IP）"
            else
              echo "[SKIP] .env 已存在，跳过生成"
            fi

            # ── 2a-patch: 幂等补丁——确保已有 .env 包含 PUBLIC_HOST ──────────
            if [ -f "$ENV_FILE" ] && [ -n "$PUBLIC_HOST" ]; then
              if ! grep -q "ALLOWED_HOSTS=.*$PUBLIC_HOST" "$ENV_FILE"; then
                sed -i "s/^ALLOWED_HOSTS=\(.*\)/ALLOWED_HOSTS=\1,$PUBLIC_HOST/" "$ENV_FILE"
                echo "[OK] Patched ALLOWED_HOSTS to include $PUBLIC_HOST"
              else
                echo "[SKIP] ALLOWED_HOSTS already contains $PUBLIC_HOST"
              fi
              if ! grep -q "CORS_ALLOWED_ORIGINS=.*$PUBLIC_HOST" "$ENV_FILE"; then
                sed -i "s|^CORS_ALLOWED_ORIGINS=\(.*\)|CORS_ALLOWED_ORIGINS=\1,http://$PUBLIC_HOST|" "$ENV_FILE"
                echo "[OK] Patched CORS_ALLOWED_ORIGINS to include http://$PUBLIC_HOST"
              else
                echo "[SKIP] CORS_ALLOWED_ORIGINS already contains $PUBLIC_HOST"
              fi
            fi

            # ── 2b: 停止 Docker 容器（释放内存，物理机部署接管端口 80）──────
            # Docker 容器与物理机服务争用端口 80 和内存，部署前必须停止。
            echo "--- 停止 Docker 容器（释放内存和端口）---"
            if command -v docker &>/dev/null; then
              docker compose -f /opt/content-gen-platform/docker-compose.yml down 2>/dev/null || true
              RUNNING=$(docker ps -q 2>/dev/null || true)
              [ -n "$RUNNING" ] && docker stop $RUNNING 2>/dev/null || true
              docker system prune -f 2>/dev/null || true
              echo "[OK] Docker 容器已停止"
            else
              echo "[SKIP] Docker 未安装，跳过"
            fi

            # ── 2c: 系统依赖安装（幂等；首次必须，后续可跳过）──────────────
            if [ "$RUN_SETUP" = "true" ]; then
              echo "--- 系统环境安装 (setup_system.sh) ---"
              APP_DIR="$APP_DIR" bash "$APP_DIR/app/scripts/deploy/setup_system.sh"
            else
              echo "--- 跳过系统环境安装（run_setup=false）---"
            fi

            # ── 2c: 物理机完整部署 ──────────────────────────────────────────
            # SKIP_CODE_SYNC=1: 代码已由 scp-action 上传，跳过 git clone/pull 步骤。
            echo "--- 物理机部署 (deploy_physical.sh) ---"
            APP_DIR="$APP_DIR" SKIP_CODE_SYNC=1 \
              bash "$APP_DIR/app/scripts/deploy/deploy_physical.sh"

            echo "===== 物理机部署完成 ====="

      # ── Step 3: 冒烟测试 ─────────────────────────────────────────────────────
      - name: Post-deploy smoke test (from GitHub runner)
        env:
          BASE_URL: http://${{ secrets.PROD_HOST }}
        run: |
          echo "--- 从 GitHub Runner 执行冒烟测试 ---"
          sleep 10

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" -d '{}' \
            "$BASE_URL/api/v1/auth/login/" 2>/dev/null || echo "000")

          case "$HTTP_CODE" in
            200|400|401|422)
              echo "[OK] API 响应正常: HTTP $HTTP_CODE"
              ;;
            *)
              echo "[FAIL] API 响应异常: HTTP $HTTP_CODE"
              exit 1
              ;;
          esac

          FE_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/" 2>/dev/null || echo "000")
          if [ "$FE_CODE" = "200" ]; then
            echo "[OK] 前端页面可访问: HTTP $FE_CODE"
          else
            echo "[WARN] 前端页面响应: HTTP $FE_CODE（Nginx 配置可能需要确认）"
          fi

          echo "--- 冒烟测试完成 ---"
